<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roomie Rhythm Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <p class="kicker">Shared Living</p>
      <h1>Roomie Rhythm</h1>
      <p class="sub">A simple web chore board you can run anywhere.</p>
    </header>

    <section class="panel panel-form" aria-label="Add chore">
      <h2>Add Chore</h2>
      <form id="chore-form">
        <div class="grid">
          <label>
            Chore
            <input id="title" type="text" maxlength="80" placeholder="Take out trash" required />
          </label>
          <label>
            Assignee
            <input id="assignee" type="text" maxlength="40" placeholder="Jordan" required />
          </label>
          <label>
            Room
            <select id="room">
              <option>Kitchen</option>
              <option>Living Room</option>
              <option>Bathroom</option>
              <option>Bedroom</option>
              <option>Other</option>
            </select>
          </label>
          <label>
            Due Date
            <input id="dueDate" type="date" />
          </label>
        </div>
        <button type="submit" class="btn primary">Add</button>
      </form>
    </section>

    <section class="panel panel-list" aria-label="Chore list">
      <div class="list-head">
        <h2>Chores</h2>
        <div class="actions">
          <select id="filter">
            <option value="all">All</option>
            <option value="open">Open</option>
            <option value="done">Done</option>
          </select>
          <button id="clear-done" class="btn ghost" type="button">Clear Done</button>
        </div>
      </div>

      <ul id="chore-list" class="chore-list"></ul>
      <p id="empty-state" class="empty">No chores yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
