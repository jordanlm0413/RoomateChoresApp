<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roomie Rhythm Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <p class="kicker">Shared Living</p>
          <h1>Roomie Rhythm</h1>
          <p class="sub">A simple shared chore board for your home.</p>
        </div>
        <div class="user-bar">
          <span id="current-username" class="username-pill"></span>
          <button id="logout-btn" class="btn ghost" type="button">Log Out</button>
        </div>
      </div>
    </header>

    <section class="panel panel-homes" aria-label="Homes">
      <div class="list-head">
        <h2>Your Homes</h2>
        <div class="actions">
          <select id="home-select" aria-label="Select home"></select>
        </div>
      </div>

      <div class="home-forms">
        <form id="create-home-form" class="inline-form">
          <label>
            New home name
            <input id="new-home-name" type="text" maxlength="60" placeholder="Maple Street House" required />
          </label>
          <button type="submit" class="btn primary">Create Home</button>
        </form>
        <form id="join-home-form" class="inline-form">
          <label>
            Invite code
            <input id="join-home-code" type="text" maxlength="16" placeholder="A1B2C3" required />
          </label>
          <button type="submit" class="btn ghost">Join Home</button>
        </form>
      </div>

      <div id="home-details" class="home-details" hidden>
        <p class="meta">Invite code: <strong id="invite-code-display"></strong> <span class="hint">(share this so others can join)</span></p>
        <form id="invite-form" class="inline-form">
          <label>
            Invite by username
            <input id="invite-username" type="text" maxlength="24" placeholder="roommate" />
          </label>
          <button type="submit" class="btn ghost">Invite</button>
        </form>
        <ul id="member-list" class="member-list"></ul>
      </div>

      <p id="home-error" class="error" hidden></p>
    </section>

    <nav class="main-tabs" aria-label="Main sections">
      <button type="button" class="main-tab active" data-tab="chores">Chores</button>
      <button type="button" class="main-tab" data-tab="calendar">Calendar</button>
      <button type="button" class="main-tab" data-tab="settings">Settings</button>
    </nav>

    <div data-tab-panel="chores">
      <section class="panel panel-form" aria-label="Add chore">
        <h2>Add Chore</h2>
        <form id="chore-form">
          <div class="grid">
            <label>
              Chore
              <input id="title" type="text" maxlength="80" placeholder="Take out trash" required />
            </label>
            <label>
              Assignee
              <input id="assignee" type="text" maxlength="40" placeholder="Jordan" required />
            </label>
            <label>
              Room
              <select id="room">
                <option>Kitchen</option>
                <option>Living Room</option>
                <option>Bathroom</option>
                <option>Bedroom</option>
                <option>Other</option>
              </select>
            </label>
            <label>
              Due Date
              <input id="dueDate" type="date" />
            </label>
          </div>
          <button type="submit" class="btn primary">Add</button>
        </form>
      </section>

      <section class="panel panel-list" aria-label="Chore list">
        <div class="list-head">
          <h2>Chores</h2>
          <div class="actions">
            <select id="filter">
              <option value="all">All</option>
              <option value="open">Open</option>
              <option value="done">Done</option>
            </select>
            <button id="clear-done" class="btn ghost" type="button">Clear Done</button>
          </div>
        </div>

        <ul id="chore-list" class="chore-list"></ul>
        <p id="empty-state" class="empty">No chores yet. Add your first one above.</p>
      </section>
    </div>

    <div data-tab-panel="calendar" hidden>
      <section class="panel panel-calendar" aria-label="Calendar">
        <div class="list-head">
          <h2 id="calendar-month-label">Calendar</h2>
          <div class="actions">
            <button id="calendar-prev" class="btn ghost" type="button" aria-label="Previous month">&larr;</button>
            <button id="calendar-today" class="btn ghost" type="button">Today</button>
            <button id="calendar-next" class="btn ghost" type="button" aria-label="Next month">&rarr;</button>
          </div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>
    </div>

    <div data-tab-panel="settings" hidden>
      <section class="panel panel-settings" aria-label="Settings">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-settings-tab="account">Account</button>
          <button type="button" class="tab" data-settings-tab="home">Home</button>
        </div>

        <div data-settings-panel="account">
          <form id="account-form" class="auth-form">
            <label>
              New username
              <input id="settings-username" type="text" minlength="3" maxlength="24" placeholder="Leave blank to keep current" />
            </label>
            <label>
              New password
              <input id="settings-new-password" type="password" minlength="8" placeholder="Leave blank to keep current" />
            </label>
            <label>
              Current password
              <input id="settings-current-password" type="password" required autocomplete="current-password" />
            </label>
            <button type="submit" class="btn primary">Save Account Changes</button>
          </form>
          <p id="account-error" class="error" hidden></p>
          <p id="account-success" class="success" hidden></p>
        </div>

        <div data-settings-panel="home" hidden>
          <form id="rename-home-form" class="inline-form">
            <label>
              Home name
              <input id="rename-home-input" type="text" maxlength="60" />
            </label>
            <button type="submit" class="btn primary">Rename Home</button>
          </form>

          <div class="home-settings-actions">
            <button id="regenerate-code-btn" class="btn ghost" type="button">Regenerate Invite Code</button>
            <button id="leave-home-btn" class="btn ghost" type="button">Leave Home</button>
            <button id="delete-home-btn" class="btn ghost danger" type="button">Delete Home</button>
          </div>

          <p id="settings-home-error" class="error" hidden></p>
          <p id="settings-home-success" class="success" hidden></p>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
