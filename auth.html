<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Roomie Rhythm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-banner">
    <div class="site-banner-row">
      <p class="brand">Roomie Rhythm</p>
      <button id="theme-toggle" class="btn ghost" type="button" aria-pressed="false">Dark Mode</button>
    </div>
  </header>

  <main id="main-content" class="shell auth-shell" tabindex="-1">
    <p class="sub auth-intro">Sign in to your account or create one to get started.</p>

    <section class="panel auth-panel" aria-label="Sign in or create account">
      <div class="tabs" role="tablist" aria-label="Account access">
        <button type="button" class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form" data-auth-tab="login">Sign In</button>
        <button type="button" class="tab" id="tab-signup" role="tab" aria-selected="false" tabindex="-1" aria-controls="signup-form" data-auth-tab="signup">Create Account</button>
      </div>

      <form id="login-form" class="auth-form" role="tabpanel" aria-labelledby="tab-login">
        <label>
          Username
          <input id="login-username" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <div class="password-field">
            <input id="login-password" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        <button type="submit" class="btn primary">Sign In</button>
      </form>

      <form id="signup-form" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <label>
          Create Username
          <input id="signup-username" type="text" minlength="3" maxlength="24" autocomplete="username" required />
        </label>
        <p class="hint">3-24 characters for username.</p>
        <label>
          Create Password
          <div class="password-field">
            <input id="signup-password" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        
        <p class="hint">At least 8 characters for password.</p>
        <label>
          Confirm Password
          <div class="password-field">
            <input id="signup-password-confirm" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="password-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        <button type="submit" class="btn primary">Create Account</button>
      </form>
    
      <button id="test" class="test button" >Test Index</button>
    
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
